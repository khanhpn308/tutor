<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="478" viewBox="0 0 1180 478" role="img" aria-label="Buffered Channel: quá tải và từ chối tác vụ">

<style>
  text { font-family: Arial, "DejaVu Sans", sans-serif; fill: #172b4d; }
  .title { font-size: 26px; font-weight: 700; fill: #0b2545; }
  .sub { font-size: 15px; fill: #516782; }
  .section { font-size: 16px; font-weight: 700; fill: #194a76; }
  .node { font-size: 15px; font-weight: 600; }
  .minor { font-size: 13px; font-weight: 400; fill: #425a78; }
  .edgeLabel { font-size: 13px; font-weight: 600; fill: #1c628a; }
  .arrow { fill: none; stroke: #3286b5; stroke-width: 2.6; marker-end: url(#head); stroke-linejoin: round; }
  .dashed { stroke-dasharray: 8 6; }
</style>
<defs><marker id="head" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3286b5"/></marker></defs><rect width="1180" height="478" fill="#ffffff"/>
<text x="30" y="44" class="title" text-anchor="start">Buffered Channel: quá tải và từ chối tác vụ</text><text x="30" y="68" class="sub" text-anchor="start">Ví dụ non-blocking enqueue khi chưa có worker đang xử lý</text>
<rect x="32" y="204" width="220" height="77" rx="13" fill="#ffffff" stroke="#aacddd" stroke-width="2"/><text x="142" y="237.6" class="node" text-anchor="middle" font-size="15">60 telemetry jobs</text><text x="142" y="257.6" class="minor" text-anchor="middle" font-size="14">Producer non-blocking</text><rect x="310" y="204" width="217" height="77" rx="13" fill="#e9f4ff" stroke="#aacddd" stroke-width="2"/><text x="418.5" y="237.6" class="node" text-anchor="middle" font-size="15">Buffered queue</text><text x="418.5" y="257.6" class="minor" text-anchor="middle" font-size="14">Capacity = 50</text><path class="arrow" d="M252 242 L310 242"/><rect x="596" y="95" width="212" height="82" rx="13" fill="#eff9f2" stroke="#95caac" stroke-width="2"/><text x="702" y="131.1" class="node" text-anchor="middle" font-size="15">50 accepted</text><text x="702" y="151.1" class="minor" text-anchor="middle" font-size="14">Queued for workers</text><rect x="596" y="314" width="212" height="82" rx="13" fill="#fff3ef" stroke="#e5b2a2" stroke-width="2"/><text x="702" y="350.1" class="node" text-anchor="middle" font-size="15">10 rejected</text><text x="702" y="370.1" class="minor" text-anchor="middle" font-size="14">Queue full</text><path class="arrow" d="M527 235 L560 235 L560 135 L596 135"/><text x="572" y="111" class="edgeLabel" text-anchor="middle">Accepted</text><path class="arrow" d="M527 252 L554 252 L554 353 L596 353"/><text x="573" y="301" class="edgeLabel" text-anchor="middle">Rejected</text><rect x="876" y="95" width="275" height="82" rx="13" fill="#ffffff" stroke="#aacddd" stroke-width="2"/><text x="1013.5" y="131.1" class="node" text-anchor="middle" font-size="15">4 workers</text><text x="1013.5" y="151.1" class="minor" text-anchor="middle" font-size="14">Process enqueued jobs</text><rect x="876" y="206" width="275" height="80" rx="13" fill="#f0f7fd" stroke="#aacddd" stroke-width="2"/><text x="1013.5" y="241.1" class="node" text-anchor="middle" font-size="15">PostgreSQL</text><text x="1013.5" y="261.1" class="minor" text-anchor="middle" font-size="14">Persist after processing</text><rect x="876" y="314" width="275" height="82" rx="13" fill="#fff9f2" stroke="#aacddd" stroke-width="2"/><text x="1013.5" y="350.1" class="node" text-anchor="middle" font-size="15">Overflow counter</text><text x="1013.5" y="370.1" class="minor" text-anchor="middle" font-size="14">Alert and retry policy</text><path class="arrow" d="M808 136 L876 136"/><path class="arrow" d="M1013 177 L1013 206"/><path class="arrow" d="M808 355 L876 355"/><text x="35" y="451" class="sub" text-anchor="start">Dữ liệu 50/60 và 4 workers là ví dụ bài tập, không phải cấu hình production đã kiểm định.</text>
</svg>
