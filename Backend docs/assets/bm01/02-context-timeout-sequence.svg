<line x1="814" y1="988" x2="826" y2="972" stroke="#994C31" stroke-width="3" />
<text x="651" y="963" font-size="19" font-weight="650" fill="#994C31" text-anchor="middle" class="message">Không nhận biết hủy kịp</text>
<line x1="838" y1="1050" x2="1190" y2="1050" stroke="#994C31" stroke-width="3.2"  marker-end="url(#arrow-red)"/>
<text x="1014" y="1033" font-size="19" font-weight="650" fill="#994C31" text-anchor="middle" class="message">Truy vấn / COMMIT có thể tiếp tục</text>
<line x1="1190" y1="1117" x2="838" y2="1117" stroke="#994C31" stroke-width="3.2" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/>
<text x="1014" y="1100" font-size="19" font-weight="650" fill="#994C31" text-anchor="middle" class="message">Phản hồi có thể thất lạc</text>
<rect x="76" y="1154" width="1228" height="55" rx="12" fill="#FFFDFC" stroke="#D49B82" stroke-width="1.6"/>
<text x="690" y="1177" font-size="18" font-weight="600" fill="#18324F" text-anchor="middle" >Client timeout không xác định được COMMIT thành công hay thất bại.</text>
<text x="690" y="1200" font-size="18" font-weight="400" fill="#42607B" text-anchor="middle" >Cần idempotency key và cơ chế đối soát (reconciliation).</text>
<rect x="38" y="1242" width="1304" height="54" rx="12" fill="#F0F5FA" stroke="none" stroke-width="1"/>
<text x="63" y="1276" font-size="20" font-weight="700" fill="#18324F" text-anchor="start" >Lưu ý:</text>
<text x="154" y="1276" font-size="20" font-weight="400" fill="#42607B" text-anchor="start" >Context chỉ phát tín hiệu hủy; không cưỡng bức dừng goroutine hoặc chứng minh rollback.</text>
</svg>
