<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1320" width="1380" height="1320" role="img" aria-labelledby="ttl desc">
<title id="ttl">Context Timeout và PostgreSQL: hai kịch bản sau deadline</title>
<desc id="desc">Sơ đồ tuần tự gồm Ingestion Worker, Go Context, Database Driver và PostgreSQL. Nhánh A driver nhận biết hủy và trả quyền điều khiển. Nhánh B không phản hồi hủy kịp hoặc kết quả COMMIT bất định, cần idempotency và đối soát.</desc>
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#2F75AA" stroke-width="1.5" fill="none"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#20613B" stroke-width="1.5" fill="none"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#994C31" stroke-width="1.5" fill="none"/></marker>
</defs>
<style>
 text {font-family:Arial,"DejaVu Sans","Liberation Sans",sans-serif;}
 .message {paint-order:stroke fill;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round;}
</style>
