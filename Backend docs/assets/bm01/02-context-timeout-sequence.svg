<text x="1190" y="179" font-size="20" font-weight="700" fill="#18324F" text-anchor="middle" >PostgreSQL</text>
<text x="1190" y="203" font-size="17" font-weight="400" fill="#42607B" text-anchor="middle" >Máy chủ CSDL</text>
