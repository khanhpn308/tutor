<text x="327" y="320" font-size="20" font-weight="650" fill="#18324F" text-anchor="middle" class="message">Tạo context + deadline</text>
<line x1="172" y1="398" x2="838" y2="398" stroke="#2F75AA" stroke-width="3.2"  marker-end="url(#arrow-blue)"/>
<text x="505" y="381" font-size="20" font-weight="650" fill="#18324F" text-anchor="middle" class="message">ExecContext(ctx, query)</text>
<line x1="838" y1="461" x2="1190" y2="461" stroke="#2F75AA" stroke-width="3.2"  marker-end="url(#arrow-blue)"/>
<text x="1014" y="444" font-size="20" font-weight="650" fill="#18324F" text-anchor="middle" class="message">Gửi truy vấn SQL</text>
<rect x="364" y="485" width="236" height="32" rx="10" fill="#FFF7E8" stroke="#E9B96B" stroke-width="1.5"/>
<text x="482" y="507" font-size="19" font-weight="700" fill="#86521C" text-anchor="middle" >Deadline hết hạn</text>
<line x1="482" y1="645" x2="838" y2="645" stroke="#20613B" stroke-width="3.2" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/>
<text x="660" y="628" font-size="20" font-weight="650" fill="#20613B" text-anchor="middle" class="message">Driver quan sát ctx.Done()</text>
<line x1="838" y1="714" x2="1190" y2="714" stroke="#20613B" stroke-width="3.2" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/>
<text x="1014" y="697" font-size="19" font-weight="650" fill="#20613B" text-anchor="middle" class="message">Hủy truy vấn (nếu hỗ trợ)</text>
<line x1="838" y1="783" x2="172" y2="783" stroke="#20613B" stroke-width="3.2" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/>
<text x="505" y="766" font-size="20" font-weight="650" fill="#20613B" text-anchor="middle" class="message">Trả lỗi; worker giải phóng tài nguyên</text>
<text x="78" y="838" font-size="18" font-weight="400" fill="#20613B" text-anchor="start" >Lệnh hủy / đóng kết nối và loại lỗi cụ thể phụ thuộc driver, mạng và thời điểm thực thi.</text>
<line x1="482" y1="980" x2="820" y2="980" stroke="#994C31" stroke-width="3.2" stroke-dasharray="9 7" marker-end=""/>
