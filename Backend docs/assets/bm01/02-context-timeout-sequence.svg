<text x="62" y="105" font-size="21" font-weight="400" fill="#42607B" text-anchor="start" >Hai kịch bản: hủy I/O hợp tác và trạng thái COMMIT bất định</text>
<line x1="38" y1="126" x2="1342" y2="126" stroke="#C6D8E8" stroke-width="2" />
<rect x="45" y="148" width="254" height="75" rx="11" fill="#E8F3FE" stroke="#AECDE5" stroke-width="2"/>
