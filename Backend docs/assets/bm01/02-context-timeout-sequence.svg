<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="918" viewBox="0 0 1180 918" role="img" aria-label="Context timeout và ranh giới hủy I/O">

<style>
  text { font-family: Arial, "DejaVu Sans", sans-serif; fill: #172b4d; }
  .title { font-size: 26px; font-weight: 700; fill: #0b2545; }
  .sub { font-size: 15px; fill: #516782; }
  .section { font-size: 16px; font-weight: 700; fill: #194a76; }
  .node { font-size: 15px; font-weight: 600; }
  .minor { font-size: 13px; font-weight: 400; fill: #425a78; }
  .edgeLabel { font-size: 13px; font-weight: 600; fill: #1c628a; }
  .arrow { fill: none; stroke: #3286b5; stroke-width: 2.6; marker-end: url(#head); stroke-linejoin: round; }
  .dashed { stroke-dasharray: 8 6; }
</style>
<defs><marker id="head" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3286b5"/></marker></defs><rect width="1180" height="918" fill="#ffffff"/>
<text x="30" y="44" class="title" text-anchor="start">Context timeout và ranh giới hủy I/O</text><text x="30" y="68" class="sub" text-anchor="start">Sơ đồ tình huống trong Go Backend và PostgreSQL</text>
<rect x="69" y="100" width="232" height="58" rx="13" fill="#eaf3ff" stroke="#aacddd" stroke-width="2"/><text x="185" y="124.1" class="node" text-anchor="middle" font-size="15">Ingestion</text><text x="185" y="144.1" class="minor" text-anchor="middle" font-size="14">Worker</text><path d="M185 158 L185 884" stroke="#a5bdd1" stroke-width="2" stroke-dasharray="7 7"/><rect x="341" y="100" width="232" height="58" rx="13" fill="#eaf3ff" stroke="#aacddd" stroke-width="2"/><text x="457" y="124.1" class="node" text-anchor="middle" font-size="15">Context</text><text x="457" y="144.1" class="minor" text-anchor="middle" font-size="14">(Timeout)</text><path d="M457 158 L457 884" stroke="#a5bdd1" stroke-width="2" stroke-dasharray="7 7"/><rect x="622" y="100" width="232" height="58" rx="13" fill="#eaf3ff" stroke="#aacddd" stroke-width="2"/><text x="738" y="124.1" class="node" text-anchor="middle" font-size="15">Database Driver</text><text x="738" y="144.1" class="minor" text-anchor="middle" font-size="14">/ Socket</text><path d="M738 158 L738 884" stroke="#a5bdd1" stroke-width="2" stroke-dasharray="7 7"/><rect x="892" y="100" width="232" height="58" rx="13" fill="#eaf3ff" stroke="#aacddd" stroke-width="2"/><text x="1008" y="124.1" class="node" text-anchor="middle" font-size="15">PostgreSQL</text><text x="1008" y="144.1" class="minor" text-anchor="middle" font-size="14">Server</text><path d="M1008 158 L1008 884" stroke="#a5bdd1" stroke-width="2" stroke-dasharray="7 7"/><path class="arrow" d="M185 196 L457 196"/><text x="321" y="186" class="edgeLabel" text-anchor="middle">WithTimeout(parentCtx, timeout)</text><path class="arrow" d="M185 244 L738 244"/><text x="455" y="231" class="edgeLabel" text-anchor="middle">ExecContext(ctx, query)</text><path class="arrow" d="M738 289 L1008 289"/><text x="870" y="276" class="edgeLabel" text-anchor="middle">SQL request / TCP socket</text><rect x="358" y="317" width="200" height="52" rx="13" fill="#fff5e9" stroke="#f0b77a" stroke-width="2"/><text x="458" y="338.26" class="node" text-anchor="middle" font-size="14">Deadline reached</text><text x="458" y="357.26" class="minor" text-anchor="middle" font-size="13">ctx.Done() closed</text><rect x="43" y="390" width="1096" height="190" rx="15" fill="#f1faf5" stroke="#8cc6a1" stroke-width="2"/><text x="64" y="420" class="section" text-anchor="start">NHÁNH A — Thao tác hợp tác (Cooperative)</text><path class="arrow dashed" d="M457 455 L738 455"/><text x="595" y="442" class="edgeLabel" text-anchor="middle">Cancellation signal</text><path class="arrow" d="M738 503 L1008 503"/><text x="875" y="490" class="edgeLabel" text-anchor="middle">Interrupt / close socket</text><path class="arrow dashed" d="M738 547 L185 547"/><text x="458" y="535" class="edgeLabel" text-anchor="middle">DeadlineExceeded (sớm)</text><rect x="43" y="599" width="1096" height="269" rx="15" fill="#fff6f3" stroke="#e0ad99" stroke-width="2"/><text x="64" y="627" class="section" text-anchor="start">NHÁNH B — Thao tác bất hợp tác / bất định COMMIT</text><path class="arrow dashed" d="M738 666 L457 666"/><text x="605" y="653" class="edgeLabel" text-anchor="middle">Không phản hồi hủy</text><path class="arrow" d="M738 715 L1008 715"/><text x="870" y="700" class="edgeLabel" text-anchor="middle">I/O bị nghẽn / lệnh COMMIT</text><rect x="75" y="756" width="1028" height="87" rx="13" fill="#ffffff" stroke="#e2b09e" stroke-width="2"/><text x="589" y="784.6" class="node" text-anchor="middle" font-size="15">Worker có thể tiếp tục bị chặn; COMMIT có thể đã xảy ra</text><text x="589" y="804.6" class="minor" text-anchor="middle" font-size="14">Không thể suy ra trạng thái giao dịch chỉ từ timeout</text><text x="589" y="824.6" class="minor" text-anchor="middle" font-size="14">Ứng dụng cần đối soát kết quả (reconciliation)</text>
</svg>
