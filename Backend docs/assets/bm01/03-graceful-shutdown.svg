<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="475" viewBox="0 0 1250 475" role="img" aria-label="Trình tự Graceful Shutdown an toàn">

<style>
  text { font-family: Arial, "DejaVu Sans", sans-serif; fill: #172b4d; }
  .title { font-size: 26px; font-weight: 700; fill: #0b2545; }
  .sub { font-size: 15px; fill: #516782; }
  .section { font-size: 16px; font-weight: 700; fill: #194a76; }
  .node { font-size: 15px; font-weight: 600; }
  .minor { font-size: 13px; font-weight: 400; fill: #425a78; }
  .edgeLabel { font-size: 13px; font-weight: 600; fill: #1c628a; }
  .arrow { fill: none; stroke: #3286b5; stroke-width: 2.6; marker-end: url(#head); stroke-linejoin: round; }
  .dashed { stroke-dasharray: 8 6; }
</style>
<defs><marker id="head" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3286b5"/></marker></defs><rect width="1250" height="475" fill="#ffffff"/>
<text x="30" y="44" class="title" text-anchor="start">Trình tự Graceful Shutdown an toàn</text><text x="30" y="68" class="sub" text-anchor="start">Dừng nhận mới → chờ producer → đóng queue → drain workers</text>
<rect x="30" y="147" width="174" height="77" rx="13" fill="#eef5fb" stroke="#aacddd" stroke-width="2"/><text x="117" y="190.6" class="node" text-anchor="middle" font-size="15">RUNNING</text><path class="arrow" d="M204 186 L234 186"/><rect x="234" y="147" width="174" height="77" rx="13" fill="#eef5fb" stroke="#aacddd" stroke-width="2"/><text x="321" y="180.6" class="node" text-anchor="middle" font-size="15">STOP</text><text x="321" y="200.6" class="minor" text-anchor="middle" font-size="14">ADMISSION</text><path class="arrow" d="M408 186 L438 186"/><rect x="438" y="147" width="174" height="77" rx="13" fill="#eef5fb" stroke="#aacddd" stroke-width="2"/><text x="525" y="180.6" class="node" text-anchor="middle" font-size="15">WAIT</text><text x="525" y="200.6" class="minor" text-anchor="middle" font-size="14">PRODUCERS</text><path class="arrow" d="M612 186 L642 186"/><rect x="642" y="147" width="174" height="77" rx="13" fill="#eef5fb" stroke="#aacddd" stroke-width="2"/><text x="729" y="180.6" class="node" text-anchor="middle" font-size="15">CLOSE</text><text x="729" y="200.6" class="minor" text-anchor="middle" font-size="14">QUEUE</text><path class="arrow" d="M816 186 L846 186"/><rect x="846" y="147" width="174" height="77" rx="13" fill="#eef5fb" stroke="#aacddd" stroke-width="2"/><text x="933" y="180.6" class="node" text-anchor="middle" font-size="15">DRAIN</text><text x="933" y="200.6" class="minor" text-anchor="middle" font-size="14">WORKERS</text><path class="arrow" d="M1020 186 L1050 186"/><rect x="1050" y="147" width="174" height="77" rx="13" fill="#e7f9ee" stroke="#81c69d" stroke-width="2"/><text x="1137" y="180.6" class="node" text-anchor="middle" font-size="15">CLEAN</text><text x="1137" y="200.6" class="minor" text-anchor="middle" font-size="14">STOP</text><rect x="365" y="326" width="270" height="80" rx="13" fill="#fff1ed" stroke="#e3a49c" stroke-width="2"/><text x="500" y="361.1" class="node" text-anchor="middle" font-size="15">ABORT POLICY</text><text x="500" y="381.1" class="minor" text-anchor="middle" font-size="14">Không đóng queue</text><rect x="794" y="326" width="340" height="80" rx="13" fill="#fff1ed" stroke="#e3a49c" stroke-width="2"/><text x="964" y="361.1" class="node" text-anchor="middle" font-size="15">LOG UNFINISHED</text><text x="964" y="381.1" class="minor" text-anchor="middle" font-size="14">TERMINAL ABORT</text><path class="arrow" d="M525 224 L525 326"/><text x="525" y="274" class="edgeLabel" text-anchor="middle">Producer timeout</text><path class="arrow" d="M933 224 L933 326"/><text x="933" y="274" class="edgeLabel" text-anchor="middle">Worker timeout</text><text x="30" y="455" class="sub" text-anchor="start">Điều kiện trọng yếu: không đóng queue khi vẫn còn producer có thể gửi dữ liệu.</text>
</svg>
